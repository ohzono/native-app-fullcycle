name: Validate Schema

# 必須チェックにできるよう on.paths で絞らず常に起動し、対象パスの変更有無は changes ジョブで判定する。
# 対象外の変更では validate がスキップされ、スキップは成功として扱われる。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      # pull_request では API で差分を取るので checkout 不要。push では git で直前のコミットと比較する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            schema:
              - 'commands/**'
              - 'skills/status/**'
              - 'skills/cleanup/**'
              - 'templates/**/.full-cycle-state.template.json'
              - 'scripts/validate-fullcycle-schema.sh'
              - 'scripts/test/validate-fullcycle-schema.test.sh'
              - '.github/workflows/validate-schema.yml'

  validate:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install yq
        run: |
          # バージョン固定（vendoring の SHA pin 方針と一貫させる）
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Validate fullcycle schema
        run: bash scripts/validate-fullcycle-schema.sh
      - name: Run validator self-test
        run: bash scripts/test/validate-fullcycle-schema.test.sh
