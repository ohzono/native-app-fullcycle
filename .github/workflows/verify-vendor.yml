name: Verify vendored android-skills

# android-* ラッパー skill が参照する vendor/android-skills/... のパスが実在するかを
# 決定論的に検証する。vendored copy（実ファイル同梱）なので submodule 初期化は不要。
# upstream のリネームや pin 更新で参照が切れた場合にここで検知する。
# 必須チェックにできるよう on.paths で絞らず常に起動し、対象パスの変更有無は changes ジョブで判定する。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      vendor: ${{ steps.filter.outputs.vendor }}
    steps:
      # pull_request では API で差分を取るので checkout 不要。push では git で直前のコミットと比較する。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 1
      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            vendor:
              - 'skills/android-*/**'
              - 'vendor/android-skills/**'
              - 'scripts/sync-android-skills.sh'
              - 'scripts/verify-android-wrappers.sh'
              - '.github/workflows/verify-vendor.yml'

  verify:
    needs: changes
    if: needs.changes.outputs.vendor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Verify android wrapper vendor paths
        run: bash scripts/verify-android-wrappers.sh
