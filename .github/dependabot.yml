version: 2

# 対象は GitHub Actions のみ。
# - templates/kmp-ios-android の Gradle は Phase 0 でコピーされる雛形で、CI ではビルドしない
# - vendor/ と skills/swiftui-pro は scripts/sync-*.sh の SHA pin で更新する
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
